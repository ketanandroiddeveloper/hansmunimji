; PHP settings for this directory (PHP-FPM / CGI read .user.ini; the host may cap these values).
; Admin uploads: images up to 20 MB, video 250 MB, audio 300 MB.
upload_max_filesize = 300M
post_max_size = 310M
max_execution_time = 120
max_input_time = 300
memory_limit = 256M
display_errors = Off
log_errors = On
